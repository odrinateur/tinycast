name: Release

run-name: "Tinycast ${{ inputs.version }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME=Tinycast PRODUCT_BUNDLE_IDENTIFIER=com.tinycast.app \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package DMG
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app"
          ./Scripts/verify-signature.sh "$APP"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName Tinycast \
            "dist/Tinycast-${VERSION}.dmg"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "dist/Tinycast-${VERSION}.dmg" \
            --title "Tinycast ${VERSION}" \
            --notes "brew install --cask odrinateur/tap/tinycast"

      - name: Homebrew cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CASK: tinycast
          DMG: dist/Tinycast-${{ inputs.version }}.dmg
          APP_REPO: ${{ github.repository }}
        run: ./Scripts/publish-tap.sh
