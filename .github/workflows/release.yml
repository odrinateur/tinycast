name: Release

on:
  push:
    branches:
      - strip/personal
      - main
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 0.2.1 (optional: leave blank to auto-increment)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "v0.2.0")
            CLEAN_VER="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$CLEAN_VER"
            patch=$((patch + 1))
            VERSION="${major}.${minor}.${patch}"
          fi
          echo "Releasing version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME=Tinycast PRODUCT_BUNDLE_IDENTIFIER=com.tinycast.app \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package DMG
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Tinycast.app"
          ./Scripts/verify-signature.sh "$APP"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName Tinycast \
            "dist/Tinycast-${VERSION}.dmg"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "dist/Tinycast-${VERSION}.dmg" \
            --title "Tinycast ${VERSION}" \
            --notes "brew install --cask odrinateur/tap/tinycast"

      - name: Homebrew cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CASK: tinycast
          DMG: dist/Tinycast-${VERSION}.dmg
          APP_REPO: ${{ github.repository }}
        run: ./Scripts/publish-tap.sh
